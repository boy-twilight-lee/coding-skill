<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ui-use-preview</title>
  <style>/* APP_STYLES */</style>
</head>
<body class="reuse-app">
  <header class="reuse-header">
    <div class="reuse-brand">
      <span class="reuse-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0 0-3L17 5a2.1 2.1 0 0 0-3 0L4 15.5V20Z"/><path d="m13.5 5.5 4.5 4.5"/></svg></span>
      <h1>ui-use-preview</h1>
    </div>
    <span id="workspace" class="reuse-workspace">正在关联当前工作区…</span>
  </header>
  <main class="reuse-main">
    <section class="reuse-panel reuse-canvas" aria-labelledby="canvas-title">
      <div class="reuse-panel-head">
        <div class="reuse-panel-heading"><span class="reuse-eyebrow">CANVAS</span><h2 id="canvas-title">设计预览</h2><span id="canvas-hint" class="reuse-hint">选择文件后自动生成标注</span></div>
        <div class="reuse-panel-actions">
          <button id="download" class="reuse-button" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 19h14"/></svg>下载标注</button>
          <div id="zoom-group" class="reuse-zoom" hidden><button id="zoom-out" type="button" aria-label="缩小">−</button><span id="zoom-value">100%</span><button id="zoom-in" type="button" aria-label="放大">+</button></div>
          <button id="reset" class="reuse-icon-button" type="button" aria-label="重新选择设计稿" title="重新选择设计稿" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
        </div>
      </div>
      <div id="stage" class="reuse-stage">
        <input id="source" type="file" accept=".html,.htm,.png,.jpg,.jpeg,.webp" disabled hidden>
        <button id="upload" class="reuse-upload" type="button" aria-label="上传 HTML 或设计图，选择后自动生成标注" disabled>
          <span class="reuse-upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-4.5 4.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg></span>
          <span class="reuse-upload-title">拖入 HTML 或设计图</span>
          <span class="reuse-upload-desc">选择后会自动检索工作区里的公共组件，把组件名、路径和适配建议标注到页面上。</span>
          <span class="reuse-formats"><span class="reuse-chip reuse-chip-accent">HTML</span><span class="reuse-chip">PNG</span><span class="reuse-chip">JPG</span><span class="reuse-chip">WebP</span><span class="reuse-chip">≤ 8 MiB</span></span>
          <span class="reuse-upload-foot">点击上传 · 支持拖拽与粘贴截图</span>
        </button>
        <div id="progress" class="reuse-progress" role="status" aria-live="polite" hidden>
          <span id="progress-file" class="reuse-progress-file"></span>
          <span class="reuse-progress-title"><span class="reuse-spinner" aria-hidden="true"></span><span id="progress-text">读取设计文件…</span></span>
          <span class="reuse-progress-track" aria-hidden="true"><span></span></span>
        </div>
        <div id="doc" class="reuse-doc" hidden>
          <div class="reuse-doc-frame">
            <div class="reuse-doc-topbar"><span class="reuse-doc-dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="doc-url"></span><span class="reuse-doc-type">静态 HTML</span></div>
            <div id="preview" role="region" aria-label="带组件复用标注的 HTML 预览"></div>
          </div>
        </div>
        <p id="status" class="reuse-status" role="status" aria-live="polite" hidden></p>
        <button id="retry" class="reuse-button" type="button" hidden>重新生成标注</button>
      </div>
    </section>
    <aside class="reuse-panel reuse-inspector" aria-labelledby="list-title">
      <div class="reuse-panel-head"><h2 id="list-title">复用清单</h2><span id="count" class="reuse-count">0</span></div>
      <div id="filter" class="reuse-filter" role="group" aria-label="按建议类型筛选" hidden>
        <button type="button" data-filter="all" aria-pressed="true">全部 <em data-count="all">0</em></button>
        <button type="button" data-filter="reuse" aria-pressed="false">复用 <em data-count="reuse">0</em></button>
        <button type="button" data-filter="adapt" aria-pressed="false">适配 <em data-count="adapt">0</em></button>
        <button type="button" data-filter="new" aria-pressed="false">新建 <em data-count="new">0</em></button>
      </div>
      <div class="reuse-list-body">
        <div id="list-empty" class="reuse-list-empty"><h3>还没有标注</h3><p>选择设计稿后会自动生成清单，编号与画布上的标记一一对应。</p></div>
        <div id="annotations" hidden></div>
        <p id="filter-empty" class="reuse-filter-empty" hidden>当前分类没有标注</p>
      </div>
      <div id="summary" class="reuse-summary" hidden></div>
      <div class="reuse-legend"><span><i class="reuse-legend-reuse"></i>可直接复用</span><span><i class="reuse-legend-adapt"></i>需适配</span><span><i class="reuse-legend-new"></i>建议新建</span></div>
    </aside>
  </main>
  <div id="toast" class="reuse-toast" role="status" aria-live="polite" hidden><span aria-hidden="true"></span><span id="toast-text"></span></div>
  <script>/* APP_SCRIPT */</script>
</body>
</html>
